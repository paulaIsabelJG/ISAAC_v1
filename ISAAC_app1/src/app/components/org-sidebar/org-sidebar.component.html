<aside class="org-sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <span class="sidebar-brand">IS</span>
  </div>

  <!-- Nav principal -->
  <nav class="sidebar-nav">

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'home'"
            (click)="goHome()"
            title="Inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'users'"
            (click)="goUsers()"
            title="Usuarios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </button>

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'boards'"
            (click)="goBoards()"
            title="Tableros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'stats'"
            (click)="goStats()"
            title="Estadísticas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
        <line x1="2"  y1="20" x2="22" y2="20"/>
      </svg>
    </button>

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'objectives'"
            (click)="goObjectives()"
            title="Objetivos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
    </button>

    <button class="sidebar-btn"
            [class.sidebar-btn--active]="activeItem === 'profile'"
            (click)="goProfile()"
            title="Perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>

  </nav>

  <!-- Footer: logout -->
  <div class="sidebar-footer">
    <button class="sidebar-btn sidebar-btn--logout" (click)="logout()" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

</aside>
