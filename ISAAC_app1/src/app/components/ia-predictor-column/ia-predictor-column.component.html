<!-- Cabecera opcional (contextos de multitablero) -->
@if (showHeader) {
  <div class="ipc-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    Predictor IA
  </div>
}

<!-- Grid de celdas IA -->
<div class="ipc-grid"
     [style.grid-template-columns]="gridColsStyle"
     [style.grid-template-rows]="gridRowsStyle">
  @for (i of cells; track i) {
    <div class="ipc-cell">
      <img src="assets/board-builder/logo-IA.png" class="ipc-logo" alt="IA"/>
      <span class="ipc-label">PICTO IA</span>
    </div>
  }
</div>
