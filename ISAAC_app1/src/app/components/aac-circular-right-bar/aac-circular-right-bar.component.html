<div class="acrb-bar">

  @for (item of rightBarItems; track item) {
    @if (isVisible(item)) {

      @switch (item) {
        @case ('home') {
          <button class="acrb-btn acrb-btn--home"
                  (click)="onHome()"
                  title="Inicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="acrb-btn-label">Inicio</span>
          </button>
        }

        @case ('back') {
          <button class="acrb-btn acrb-btn--back"
                  [class.acrb-btn--disabled]="!canGoBack"
                  [disabled]="!canGoBack"
                  (click)="onBack()"
                  title="Atrás">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span class="acrb-btn-label">Atrás</span>
          </button>
        }

        @case ('speak') {
          <button class="acrb-btn acrb-btn--speak"
                  [class.acrb-btn--disabled]="!hasPhrase"
                  [disabled]="!hasPhrase"
                  (click)="onSpeak()"
                  title="Hablar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <span class="acrb-btn-label">Hablar</span>
          </button>
        }

        @case ('deleteLast') {
          <button class="acrb-btn acrb-btn--erase"
                  [class.acrb-btn--disabled]="!hasPhrase"
                  [disabled]="!hasPhrase"
                  (click)="onErase()"
                  title="Borrar último">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
            <span class="acrb-btn-label">Borrar</span>
          </button>
        }

        @case ('clearAll') {
          <button class="acrb-btn acrb-btn--clear"
                  [class.acrb-btn--disabled]="!hasPhrase"
                  [disabled]="!hasPhrase"
                  (click)="onClear()"
                  title="Limpiar todo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
            </svg>
            <span class="acrb-btn-label">Limpiar</span>
          </button>
        }

        @case ('reloadBoard') {
          <button class="acrb-btn acrb-btn--reload"
                  (click)="onReloadBoard()"
                  title="Recargar tablero"
                  aria-label="Recargar tablero">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-.49-3.55"/>
            </svg>
            <span class="acrb-btn-label">Recargar</span>
          </button>
        }
      }

    }
  }


  @if (showBackToCategories) {
    <button class="acrb-btn acrb-btn--categories"
            (click)="onBackToCategories()"
            title="Categorías"
            aria-label="Volver a categorías">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="acrb-btn-label">Categorías</span>
    </button>
  }

  @if (showMoreOptions) {
    <button class="acrb-btn acrb-btn--more"
            (click)="onMoreOptions()"
            title="Más opciones"
            aria-label="Mostrar más opciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.55"/>
      </svg>
      <span class="acrb-btn-label">Más opciones</span>
    </button>
  }

</div>
