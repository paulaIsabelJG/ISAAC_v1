<div class="pb-strip">

  @if (items.length === 0) {
    <span class="pb-placeholder">{{ placeholder }}</span>
  } @else {
    @for (item of items; track $index) {
      <div class="pb-item"
           [style.border-bottom-color]="item.color || null"
           [style.border-bottom-width]="item.color ? '3px' : null">
        <app-pict-cell-content
          [pict]="toCell(item)"
          emptyType="empty-div">
        </app-pict-cell-content>
      </div>
    }
  }

</div>
