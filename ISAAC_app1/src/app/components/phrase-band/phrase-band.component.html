<div class="pb-strip">

  @if (items.length === 0) {
    <span class="pb-placeholder">{{ placeholder }}</span>
  } @else {
    @for (item of items; track $index) {
      <div class="pb-item"
           [style.background]="itemBg(item)"
           [style.border-color]="itemBorder(item)">
        <app-pict-cell-content
          [pict]="toCell(item)"
          emptyType="empty-div">
        </app-pict-cell-content>
      </div>
    }
  }

</div>
