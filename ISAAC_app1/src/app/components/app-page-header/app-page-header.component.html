<ion-header class="ion-no-border">
  <ion-toolbar class="aph-toolbar">

    @if (showBack) {
      <ion-buttons slot="start">
        <ion-back-button
          [defaultHref]="backHref"
          [text]="backText"
          (click)="onBackClick($event)">
        </ion-back-button>
      </ion-buttons>
    }

    <ion-title class="aph-title">{{ title }}</ion-title>

    <!-- Acciones opcionales al final: proyectar con slot="end" -->
    <ng-content></ng-content>

  </ion-toolbar>
</ion-header>
