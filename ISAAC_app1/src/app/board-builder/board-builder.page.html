<ion-header class="ion-no-border">
  <ion-toolbar class="bb-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/organization-dashboard" text="Volver"
                       (click)="$event.stopImmediatePropagation(); goBack()">
      </ion-back-button>
    </ion-buttons>
    <ion-title class="bb-title">Tablero Builder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="builder-content">
  <div class="builder-container">

    <div class="builder-card">
      <div class="builder-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h1 class="builder-title">Tablero Builder</h1>
      <p class="builder-sub">Constructor visual de tableros de pictogramas</p>
      <div class="builder-badge">Próximamente</div>
      <p class="builder-desc">
        Aquí podrás crear y personalizar tableros de comunicación aumentativa
        con pictogramas ARASAAC y pictogramas personalizados.
      </p>
    </div>

  </div>
</ion-content>
