<ion-header class="ion-no-border">
  <ion-toolbar class="sp-toolbar">
    <ion-buttons slot="start">
      <ion-back-button text="Volver"
                       (click)="$event.stopImmediatePropagation(); goBack()">
      </ion-back-button>
    </ion-buttons>
    <ion-title class="sp-title">Estadísticas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="sp-content">
  <div class="sp-container">

    <div class="sp-icon-wrap">
      <img src="assets/user-session/statistics.png" class="sp-icon" alt="Estadísticas"/>
    </div>

    <h1 class="sp-heading">Estadísticas</h1>
    <p class="sp-sub">Próximamente</p>
    <p class="sp-desc">
      Esta sección mostrará estadísticas de uso, progreso y actividad
      del usuario final. Aún en desarrollo.
    </p>

  </div>
</ion-content>
