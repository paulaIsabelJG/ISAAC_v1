<div class="comm-root" [class.comm-root--private]="privateMode">

  @if (privateMode) {
    <div class="comm-private-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           width="13" height="13" style="flex:0 0 auto">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                 a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
                 a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      Modo oculto
    </div>
  }

  @if (isLoading) {
    <div class="comm-loading">
      <ion-spinner name="crescent" color="secondary"></ion-spinner>
    </div>

  } @else if (loadError) {
    <p class="comm-error">{{ loadError }}</p>

  } @else if (board) {

    @if (isCircularBoard) {

      <!-- ══════════════════════════════════════════════════════════════════
           LAYOUT CIRCULAR: barra superior compacta + fila(tablero | barra derecha)
           ══════════════════════════════════════════════════════════════════ -->
      <app-aac-circular-top-bar
        mode="communicator"
        [config]="effectiveCircularConfig"
        [voiceEnabled]="voiceEnabled"
        [gender]="gender"
        [canGoBack]="canGoBack"
        (homeClick)="onHome()"
        (backClick)="onBack()"
        (reloadBoardClick)="onReloadBoard()">
      </app-aac-circular-top-bar>

      <div class="comm-circular-row">

        <!-- Columna Predictor IA (no para multi, ya filtrado por isCircularBoard) -->
        @if (showPredictor) {
          <app-ia-predictor-column
            [rows]="predictorIaRows"
            [cols]="predictorIaCols"
            [predictions]="predictions"
            (cellPress)="onPredictorCellPress($event)">
          </app-ia-predictor-column>
        }

        <!-- Tablero circular centrado -->
        @if (isPredictiveCircular) {
          <!-- Circular predictivo: board sintético + máquina de estados propia -->
          <app-board-circular
            [board]="predDisplayBoard"
            mode="communicator"
            [circularLayout]="true"
            [centerPict]="predCenterPict"
            (cellClick)="onPredCellPress($event.row, $event.col)">
          </app-board-circular>
        } @else {
          <app-board-circular
            [board]="board"
            mode="communicator"
            [circularLayout]="true"
            [centerPict]="isSecondaryCircular ? navSourcePict : undefined"
            (cellClick)="onCellPress($event.row, $event.col)">
          </app-board-circular>
        }

        <!-- Barra vertical derecha: Atrás + Hablar + Borrar + Limpiar + Recargar + Categorías + Más opciones -->
        <app-aac-circular-right-bar
          mode="communicator"
          [config]="effectiveCircularConfig"
          [voiceEnabled]="voiceEnabled"
          [gender]="gender"
          [canGoBack]="canGoBack"
          [showBackToCategories]="canShowBackToCategories"
          [showMoreOptions]="canShowMoreOptions"
          (homeClick)="onHome()"
          (backClick)="onBack()"
          (reloadBoardClick)="onReloadBoard()"
          (backToCategoriesClick)="backToCircularCategories()"
          (moreOptionsClick)="showMoreCircularSuggestions()">
        </app-aac-circular-right-bar>

      </div><!-- /comm-circular-row -->

    } @else {

      <!-- ══════════════════════════════════════════════════════════════════
           LAYOUT ESTÁNDAR: barra AAC horizontal + tablero
           ══════════════════════════════════════════════════════════════════ -->
      <app-aac-controls-bar
        mode="communicator"
        [voiceEnabled]="voiceEnabled"
        [gender]="gender"
        [canGoBack]="canGoBack"
        (homeClick)="onHome()"
        (backClick)="onBack()">
      </app-aac-controls-bar>

      <div class="comm-board">
        <div class="comm-board-row">

          @if (showPredictor) {
            <app-ia-predictor-column
              [rows]="predictorIaRows"
              [cols]="predictorIaCols"
              [predictions]="predictions"
              (cellPress)="onPredictorCellPress($event)">
            </app-ia-predictor-column>
          }

          @if (isMultiBoard) {
            <app-multiboard-communicator
              [masterBoard]="board"
              [gender]="gender"
              [contextUserId]="rootAutoPersonalize ? userId : ''"
              style="display:flex;flex:1;min-height:0;overflow:hidden">
            </app-multiboard-communicator>

          } @else {
            <app-board-grid
              [board]="board"
              mode="communicator"
              (cellClick)="onCellPress($event.row, $event.col)">
            </app-board-grid>
          }

        </div><!-- /comm-board-row -->
      </div><!-- /comm-board -->

    }

  }

</div><!-- /comm-root -->
