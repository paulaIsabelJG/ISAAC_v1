<div class="comm-root">

  @if (isLoading) {
    <div class="comm-loading">
      <ion-spinner name="crescent" color="secondary"></ion-spinner>
    </div>

  } @else if (loadError) {
    <p class="comm-error">{{ loadError }}</p>

  } @else if (board) {

    @if (isCircularBoard) {

      <!-- ══════════════════════════════════════════════════════════════════
           LAYOUT CIRCULAR: barra superior compacta + fila(tablero | barra derecha)
           ══════════════════════════════════════════════════════════════════ -->
      <app-aac-circular-top-bar
        mode="communicator"
        [config]="effectiveCircularConfig"
        [voiceEnabled]="voiceEnabled"
        [gender]="gender"
        [canGoBack]="canGoBack"
        (homeClick)="onHome()"
        (backClick)="onBack()">
      </app-aac-circular-top-bar>

      <div class="comm-circular-row">

        <!-- Columna Predictor IA (no para multi, ya filtrado por isCircularBoard) -->
        @if (showPredictor) {
          <app-ia-predictor-column
            [rows]="predictorIaRows"
            [cols]="predictorIaCols"
            [predictions]="predictions"
            (cellPress)="onPredictorCellPress($event)">
          </app-ia-predictor-column>
        }

        <!-- Tablero circular centrado -->
        <app-board-circular
          [board]="board"
          mode="communicator"
          [circularLayout]="true"
          [centerPict]="isSecondaryCircular ? navSourcePict : undefined"
          (cellClick)="onCellPress($event.row, $event.col)">
        </app-board-circular>

        <!-- Barra vertical derecha: Atrás + Hablar + Borrar + Limpiar -->
        <app-aac-circular-right-bar
          mode="communicator"
          [config]="effectiveCircularConfig"
          [voiceEnabled]="voiceEnabled"
          [gender]="gender"
          [canGoBack]="canGoBack"
          (homeClick)="onHome()"
          (backClick)="onBack()">
        </app-aac-circular-right-bar>

      </div><!-- /comm-circular-row -->

    } @else {

      <!-- ══════════════════════════════════════════════════════════════════
           LAYOUT ESTÁNDAR: barra AAC horizontal + tablero
           ══════════════════════════════════════════════════════════════════ -->
      <app-aac-controls-bar
        mode="communicator"
        [voiceEnabled]="voiceEnabled"
        [gender]="gender"
        [canGoBack]="canGoBack"
        (homeClick)="onHome()"
        (backClick)="onBack()">
      </app-aac-controls-bar>

      <div class="comm-board">
        <div class="comm-board-row">

          @if (showPredictor) {
            <app-ia-predictor-column
              [rows]="predictorIaRows"
              [cols]="predictorIaCols"
              [predictions]="predictions"
              (cellPress)="onPredictorCellPress($event)">
            </app-ia-predictor-column>
          }

          @if (isMultiBoard) {
            <app-multiboard-communicator
              [masterBoard]="board"
              [gender]="gender"
              [contextUserId]="rootAutoPersonalize ? userId : ''"
              style="display:flex;flex:1;min-height:0;overflow:hidden">
            </app-multiboard-communicator>

          } @else {
            <app-board-grid
              [board]="board"
              mode="communicator"
              (cellClick)="onCellPress($event.row, $event.col)">
            </app-board-grid>
          }

        </div><!-- /comm-board-row -->
      </div><!-- /comm-board -->

    }

  }

</div><!-- /comm-root -->
