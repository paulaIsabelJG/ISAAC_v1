<ion-content class="placeholder-content">
  <div class="placeholder-container">

    <div class="placeholder-card">
      <div class="placeholder-logo">ISAAC</div>

      <div class="placeholder-avatar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>

      <h1 class="placeholder-name">{{ user?.name || 'Usuario' }}</h1>
      <div class="placeholder-type-badge">{{ typeLabel }}</div>
      <p class="placeholder-email">{{ user?.email }}</p>

      <div class="placeholder-info">
        <p>Pantalla de usuario pendiente de implementación</p>
        <p class="info-sub">
          El tablero de comunicación, pictogramas y frases
          estarán disponibles en la siguiente fase.
        </p>
      </div>

      <div class="placeholder-actions">
        <button class="placeholder-action-btn" (click)="goOwnPictograms()">
          <img src="assets/pictograms/custom-pictograms.png" alt="Pictogramas"/>
          <span>Pictogramas propios</span>
        </button>
        <button class="placeholder-action-btn" (click)="goToObjectives()">
          <svg viewBox="0 0 32 32" fill="none" style="width:32px;height:32px;flex:0 0 auto">
            <path d="M5 8h22M5 13h16M5 18h12" stroke="#17a682" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="25" cy="22" r="6" fill="#17a682" opacity=".15" stroke="#17a682" stroke-width="2"/>
            <polyline points="22 22 25 25 29 19" stroke="#17a682" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span>Objetivos</span>
        </button>
      </div>

      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </div>
</ion-content>
