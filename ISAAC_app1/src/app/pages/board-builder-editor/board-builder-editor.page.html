<app-board-editor-toolbar
  [previewMode]="previewMode"
  [boardName]="board?.name ?? ''"
  [canAddToProfile]="canAddToProfile"
  [isInProfile]="isInProfile"
  (togglePreview)="togglePreview()"
  (goBack)="goBack()"
  (exportOBZ)="exportOBZ()"
  (addToProfile)="addToProfile()"
  (removeFromProfile)="removeFromProfile()">
</app-board-editor-toolbar>

<ion-content class="bbe-content">

  <!-- ══════════════════════ ESTADO CARGANDO / ERROR ══════════════════════ -->
  @if (isLoading || loadError) {
    <app-loading-error-state
      [loading]="isLoading"
      [error]="loadError"
      spinnerColor="secondary">
    </app-loading-error-state>

  <!-- ══════════════════════ MODO VISTA PREVIA ══════════════════════════ -->
  } @else if (previewMode) {
    <div class="bbe-preview-container">

    <!-- Barra AAC -->
    <div class="aac-bar">
      <button class="aac-btn aac-btn--home" (click)="aacClearPhrase()" title="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
      <button class="aac-btn aac-btn--speaker" (click)="aacSpeak()" title="Leer frase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </button>

      <app-phrase-band
        [items]="aacPhrase"
        placeholder="Pulsa los pictogramas para construir la frase…"
        class="aac-phrase-band">
      </app-phrase-band>

      <button class="aac-btn aac-btn--del" (click)="aacDeleteLast()" title="Borrar último">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
      <button class="aac-btn aac-btn--trash" (click)="aacClearPhrase()" title="Limpiar frase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
        </svg>
      </button>
    </div>

    <!-- ── GRID vista previa ──────────────────────────────────────────── -->
    @if (!isCircular) {
      <div class="bbe-preview-board">
        <app-board-grid
          [board]="board"
          mode="preview"
          (cellClick)="onCellClick($event.row, $event.col)">
        </app-board-grid>
      </div>
    }

    <!-- ── CIRCULAR vista previa ───────────────────────────────────────── -->
    @if (isCircular) {
      <app-board-circular
        [board]="board"
        mode="preview"
        [centerPict]="previewCenterPict"
        [simMode]="circularSimMode"
        [isCenterWaiting]="isCenterShowingLastPhrase"
        (cellClick)="onCellClick($event.row, $event.col)">
      </app-board-circular>
    }

    </div><!-- /bbe-preview-container -->

  <!-- ══════════════════════ MODO EDITOR NORMAL ═════════════════════════ -->
  } @else {
    <div class="bbe-layout">

      <!-- ── COLUMNA IZQUIERDA → BoardSidebarLeftComponent ──────────────── -->
      <app-board-sidebar-left
        [config]="sidebarConfig"
        [isCircular]="isCircular"
        [centerUsers]="centerUsers"
        [userBoards]="userBoards"
        [userBoardsLoading]="userBoardsLoading"
        [highlightedBoardId]="highlightedBoardId"
        [isSaving]="sidebarSaving"
        (saveConfig)="onSaveConfigRequest($event)"
        (openBoard)="openBoard($event)">
      </app-board-sidebar-left>

      <!-- ── COLUMNA CENTRAL ────────────────────────────────────────────── -->
      <div class="bbe-col-center">

        <!-- Acciones OBF / OBZ -->
        <div class="bbe-obf-bar">
          <button class="bbe-obf-btn" (click)="importOBF()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Importar OBF
          </button>
          <button class="bbe-obf-btn" (click)="importOBZ()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
              <rect x="3" y="3" width="5" height="5" rx="1"/>
            </svg>
            Importar OBZ
          </button>
          <button class="bbe-obf-btn" (click)="exportOBF()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Exportar OBF
          </button>
        </div>

        <!-- ── GRID editor ──────────────────────────────────────────────── -->
        @if (!isCircular) {
          <app-board-grid
            [board]="board"
            mode="edit"
            [selectedCell]="selectedCell"
            [draggedCell]="draggedCell"
            [dragOverCell]="dragOverCell"
            [moveSrcCell]="moveSrcCell"
            (cellClick)="onCellClick($event.row, $event.col)"
            (cellDblClick)="onCellDblClick($event.row, $event.col)"
            (cellDragStart)="onCellDragStart($event.event, $event.row, $event.col)"
            (cellDragOver)="onCellDragOver($event.event, $event.row, $event.col)"
            (cellDragLeave)="onCellDragLeave($event.event, $event.row, $event.col)"
            (cellDrop)="onCellDrop($event.event, $event.row, $event.col)"
            (cellDragEnd)="onCellDragEnd()">
          </app-board-grid>
        }

        <!-- ── CIRCULAR editor ───────────────────────────────────────────── -->
        @if (isCircular) {
          <app-board-circular
            [board]="board"
            mode="edit"
            [selectedCell]="selectedCell"
            [draggedCell]="draggedCell"
            [dragOverCell]="dragOverCell"
            [moveSrcCell]="moveSrcCell"
            (cellClick)="onCellClick($event.row, $event.col)"
            (cellDblClick)="onCellDblClick($event.row, $event.col)"
            (cellDragStart)="onCellDragStart($event.event, $event.row, $event.col)"
            (cellDragOver)="onCellDragOver($event.event, $event.row, $event.col)"
            (cellDragLeave)="onCellDragLeave($event.event, $event.row, $event.col)"
            (cellDrop)="onCellDrop($event.event, $event.row, $event.col)"
            (cellDragEnd)="onCellDragEnd()">
          </app-board-circular>
        }

      </div><!-- /col-center -->

      <!-- ── COLUMNA DERECHA → BoardCellPanelComponent ───────────────────── -->
      <app-board-cell-panel
        [selectedCell]="selectedCell"
        [cellData]="cellData"
        [isEditingCell]="isEditingCell"
        [isSaving]="isSaving"
        [isSharedBoard]="isSharedBoard"
        [isCircular]="isCircular"
        [isCenterSelected]="isCenterSelected"
        [sameShapeBoards]="sameShapeBoards"
        [boardsReady]="boardsReady"
        [personalPicts]="personalPicts"
        [personalLoading]="personalLoading"
        (saveCellRequest)="onSaveCellRequest($event)"
        (removeCellRequest)="onRemoveCellRequest()"
        (createBoardAndLink)="navigateToCreateBoard($event)">
      </app-board-cell-panel>

    </div><!-- /bbe-layout -->
  }

</ion-content>
