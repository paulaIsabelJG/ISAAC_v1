<app-board-editor-toolbar
  [previewMode]="previewMode"
  [boardName]="board?.name ?? ''"
  [canAddToProfile]="canAddToProfile"
  [isInProfile]="isInProfile"
  (togglePreview)="togglePreview()"
  (goBack)="goBack()"
  (exportOBZ)="exportOBZ()"
  (addToProfile)="addToProfile()"
  (removeFromProfile)="removeFromProfile()">
</app-board-editor-toolbar>

<ion-content class="bbe-content">

  <!-- ══════════════════════ ESTADO CARGANDO / ERROR ══════════════════════ -->
  @if (isLoading || loadError) {
    <app-loading-error-state
      [loading]="isLoading"
      [error]="loadError"
      spinnerColor="secondary">
    </app-loading-error-state>

  <!-- ══════════════════════ MODO VISTA PREVIA ══════════════════════════ -->
  <!-- → BoardPreviewContainerComponent                                    -->
  } @else if (previewMode) {
    <app-board-preview-container
      [board]="board"
      [aacPhrase]="aacPhrase"
      [isCircular]="isCircular"
      [previewCenterPict]="previewCenterPict"
      [circularSimMode]="circularSimMode"
      [isCenterShowingLastPhrase]="isCenterShowingLastPhrase"
      (cellClick)="onCellClick($event.row, $event.col)"
      (speakRequest)="aacSpeak()"
      (deleteLastRequest)="aacDeleteLast()"
      (clearPhraseRequest)="aacClearPhrase()">
    </app-board-preview-container>

  <!-- ══════════════════════ MODO EDITOR NORMAL ═════════════════════════ -->
  } @else {
    <div class="bbe-layout">

      <!-- ── COLUMNA IZQUIERDA → BoardSidebarLeftComponent ──────────────── -->
      <app-board-sidebar-left
        [config]="sidebarConfig"
        [isCircular]="isCircular"
        [centerUsers]="centerUsers"
        [userBoards]="userBoards"
        [userBoardsLoading]="userBoardsLoading"
        [highlightedBoardId]="highlightedBoardId"
        [isSaving]="sidebarSaving"
        (saveConfig)="onSaveConfigRequest($event)"
        (openBoard)="openBoard($event)">
      </app-board-sidebar-left>

      <!-- ── COLUMNA CENTRAL ────────────────────────────────────────────── -->
      <div class="bbe-col-center">

        <!-- Acciones OBF / OBZ -->
        <div class="bbe-obf-bar">
          <button class="bbe-obf-btn" (click)="importOBF()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Importar OBF
          </button>
          <button class="bbe-obf-btn" (click)="importOBZ()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
              <rect x="3" y="3" width="5" height="5" rx="1"/>
            </svg>
            Importar OBZ
          </button>
          <button class="bbe-obf-btn" (click)="exportOBF()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Exportar OBF
          </button>
        </div>

        <!-- ── GRID editor ──────────────────────────────────────────────── -->
        @if (!isCircular) {
          <app-board-grid
            [board]="board"
            mode="edit"
            [selectedCell]="selectedCell"
            [draggedCell]="draggedCell"
            [dragOverCell]="dragOverCell"
            [moveSrcCell]="moveSrcCell"
            (cellClick)="onCellClick($event.row, $event.col)"
            (cellDblClick)="onCellDblClick($event.row, $event.col)"
            (cellDragStart)="onCellDragStart($event.event, $event.row, $event.col)"
            (cellDragOver)="onCellDragOver($event.event, $event.row, $event.col)"
            (cellDragLeave)="onCellDragLeave($event.event, $event.row, $event.col)"
            (cellDrop)="onCellDrop($event.event, $event.row, $event.col)"
            (cellDragEnd)="onCellDragEnd()">
          </app-board-grid>
        }

        <!-- ── CIRCULAR editor ───────────────────────────────────────────── -->
        @if (isCircular) {
          <app-board-circular
            [board]="board"
            mode="edit"
            [selectedCell]="selectedCell"
            [draggedCell]="draggedCell"
            [dragOverCell]="dragOverCell"
            [moveSrcCell]="moveSrcCell"
            (cellClick)="onCellClick($event.row, $event.col)"
            (cellDblClick)="onCellDblClick($event.row, $event.col)"
            (cellDragStart)="onCellDragStart($event.event, $event.row, $event.col)"
            (cellDragOver)="onCellDragOver($event.event, $event.row, $event.col)"
            (cellDragLeave)="onCellDragLeave($event.event, $event.row, $event.col)"
            (cellDrop)="onCellDrop($event.event, $event.row, $event.col)"
            (cellDragEnd)="onCellDragEnd()">
          </app-board-circular>
        }

      </div><!-- /col-center -->

      <!-- ── COLUMNA DERECHA → BoardCellPanelComponent ───────────────────── -->
      <app-board-cell-panel
        [selectedCell]="selectedCell"
        [cellData]="cellData"
        [isEditingCell]="isEditingCell"
        [isSaving]="isSaving"
        [isSharedBoard]="isSharedBoard"
        [isCircular]="isCircular"
        [isCenterSelected]="isCenterSelected"
        [sameShapeBoards]="sameShapeBoards"
        [boardsReady]="boardsReady"
        [personalPicts]="personalPicts"
        [personalLoading]="personalLoading"
        (saveCellRequest)="onSaveCellRequest($event)"
        (removeCellRequest)="onRemoveCellRequest()"
        (createBoardAndLink)="navigateToCreateBoard($event)">
      </app-board-cell-panel>

    </div><!-- /bbe-layout -->
  }

</ion-content>
